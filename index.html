<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO Intelligence Hub</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060b18;
            margin: 0;
            overflow: hidden;
        }

        @keyframes draw {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }

        .animate-draw {
            animation: draw 1.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [activeIndex, setActiveIndex] = useState(-1);
            const [showConnections, setShowConnections] = useState(false);
            const [hoveredCard, setHoveredCard] = useState(null);

            const personaCards = [
                { id: 1, initials: 'MR', name: 'Morgan Rao', role: 'L&D Strategist', tag: 'Capability Engine', color: '#2dd4bf', bullets: ['Build learning paths', 'Assess skill gaps', 'Create IDPs'] },
                { id: 2, initials: 'AM', name: 'Alex Menon', role: 'HRBP', tag: 'Experience Engine', color: '#3b82f6', bullets: ['Track role risk', 'Monitor productivity', 'Flag flight risks'] },
                { id: 3, initials: 'RK', name: 'Reese Kapoor', role: 'CHRO', tag: 'Analytics & ROI', color: '#8b5cf6', bullets: ['Measure initiative impact', 'Track platform adoption', 'Optimize HR spend'] },
                { id: 4, initials: 'JE', name: 'Jordan Ellis', role: 'TA Manager', tag: 'Velocity Engine', color: '#f59e0b', bullets: ['Prioritize next hires', 'Manage JDs & interviews', 'Track cost-per-hire'] },
                { id: 5, initials: 'SP', name: 'Sam Patel', role: 'Employee', tag: 'Self-Service', color: '#10b981', bullets: ['Check benefits eligibility', 'Navigate policies', 'Find the right contact'] },
                { id: 6, initials: 'ED', name: 'Elena Diaz', role: 'Data Steward', tag: 'Compliance & Security', color: '#f43f5e', bullets: ['Monitor PII exposure', 'Audit data policies', 'Ensure compliance'] }
            ];

            useEffect(() => {
                const runSequence = async () => {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    for (let i = 0; i < personaCards.length; i++) {
                        await new Promise(resolve => setTimeout(resolve, 700));
                        setActiveIndex(i);
                    }
                    await new Promise(resolve => setTimeout(resolve, 400));
                    setShowConnections(true);
                };
                runSequence();
            }, []);

            return (
                <div className="min-h-screen bg-[#060b18] text-white flex flex-col items-center justify-center p-4">
                    <div className="relative w-full max-w-[1600px] aspect-[16/7] flex flex-col items-center justify-center">
                        
                        {/* Connection Lines Layer */}
                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                            <defs>
                                {personaCards.map((card, i) => (
                                    <linearGradient key={`grad-${i}`} id={`grad-${i}`} x1="50%" y1="80%" x2={`${50 + ((i - 2.5) * 16)}%`} y2="35%">
                                        <stop offset="0%" stopColor="#2dd4bf" stopOpacity="0" />
                                        <stop offset="100%" stopColor={card.color} stopOpacity="0.4" />
                                    </linearGradient>
                                ))}
                            </defs>
                            {showConnections && personaCards.map((card, i) => {
                                const x2 = 50 + ((i - 2.5) * 16.5);
                                return (
                                    <line
                                        key={`line-${i}`}
                                        x1="50%"
                                        y1="80%"
                                        x2={`${x2}%`}
                                        y2="40%"
                                        stroke={`url(#grad-${i})`}
                                        strokeWidth="2"
                                        strokeDasharray="1000"
                                        className="animate-draw"
                                        style={{ strokeDashoffset: 1000 }}
                                    />
                                );
                            })}
                        </svg>

                        {/* Persona Cards Arc */}
                        <div className="relative w-full h-[50%] flex items-end justify-center gap-4 z-20 px-8">
                            {personaCards.map((card, i) => {
                                const isActive = activeIndex >= i;
                                const isHighlighted = activeIndex === i || hoveredCard === i;
                                
                                return (
                                    <div
                                        key={card.id}
                                        onMouseEnter={() => setHoveredCard(i)}
                                        onMouseLeave={() => setHoveredCard(null)}
                                        className={`
                                            relative transition-all duration-700 ease-out cursor-pointer
                                            w-44 p-4 rounded-xl border transform
                                            ${isActive ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-20'}
                                            ${isHighlighted ? 'scale-110 -translate-y-4 border-opacity-100 bg-[#0a192f] shadow-2xl' : 'scale-100 border-opacity-10 bg-slate-900/40'}
                                        `}
                                        style={{
                                            borderColor: card.color,
                                            boxShadow: isHighlighted ? `0 10px 30px ${card.color}33` : 'none'
                                        }}
                                    >
                                        <div 
                                            className="w-10 h-10 rounded-full flex items-center justify-center font-bold text-xs mb-3 shadow-inner"
                                            style={{ backgroundColor: card.color, color: '#060b18' }}
                                        >
                                            {card.initials}
                                        </div>
                                        <h3 className="text-xs font-bold mb-1 truncate">{card.name}</h3>
                                        <div 
                                            className="inline-block px-2 py-0.5 rounded-full text-[9px] font-bold mb-2 border" 
                                            style={{ borderColor: `${card.color}44`, color: card.color }}
                                        >
                                            {card.role}
                                        </div>
                                        <div className="text-[9px] text-gray-500 font-black uppercase tracking-wider mb-2">{card.tag}</div>
                                        <ul className="space-y-1.5">
                                            {card.bullets.map((bullet, idx) => (
                                                <li 
                                                    key={idx} 
                                                    className="text-[10px] text-gray-300 flex items-start gap-1.5" 
                                                    style={{ opacity: isHighlighted ? 1 : 0.4 }}
                                                >
                                                    <span className="mt-1.5 w-1 h-1 rounded-full shrink-0" style={{ backgroundColor: card.color }}></span>
                                                    <span className="leading-tight">{bullet}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Central Hub Area */}
                        <div className="relative mt-4 z-10 flex flex-col items-center w-full">
                            <div className="relative flex justify-center w-full h-72">
                                <div className={`absolute bottom-[-20px] transition-all duration-1000 transform ${showConnections ? 'scale-110' : 'scale-100'}`}>
                                    <div className={`absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full blur-[100px] transition-all duration-1000 ${showConnections ? 'bg-teal-400/30 opacity-100' : 'bg-white/5 opacity-10'}`}></div>
                                    
                                    <img 
                                        src="./neo-character.png" 
                                        alt="Neo" 
                                        className={`relative h-80 w-auto object-contain z-10 transition-all duration-1000 ${showConnections ? 'brightness-110 drop-shadow-[0_0_30px_rgba(45,212,191,0.3)]' : 'brightness-90'}`}
                                        onError={(e) => {
                                            // Fallback emoji if image is not found locally
                                            e.target.style.display = 'none';
                                            e.target.parentElement.innerHTML += '<div class="text-8xl">🤖</div>';
                                        }}
                                    />
                                </div>
                            </div>

                            {/* NEO Hub Badge */}
                            <div 
                                className={`
                                    relative mt-[-80px] px-16 py-6 rounded-[2.5rem] border-2 transition-all duration-1000
                                    flex flex-col items-center text-center backdrop-blur-2xl z-30
                                    ${showConnections ? 'border-teal-400/60 bg-[#0a192f]/95 shadow-[0_30px_60px_rgba(0,0,0,0.6)]' : 'border-white/10 bg-[#0a192f]/70'}
                                `}
                            >
                                <h1 className="text-5xl font-black tracking-tighter leading-none mb-1 text-white">
                                    NEO<span className="text-teal-400 animate-pulse">.</span>
                                </h1>
                                <p className="text-xs italic text-teal-100/60 font-semibold tracking-wide">
                                    Your People Intelligence Hub
                                </p>
                                <div className="h-[1px] w-48 bg-gradient-to-r from-transparent via-teal-500/50 to-transparent my-3"></div>
                                <p className="text-[10px] uppercase tracking-[0.3em] text-teal-400 font-black">
                                    One assistant. Every HR workflow.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
